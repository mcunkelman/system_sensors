[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "system_sensors"
version = "0.1.0"
description = "Implementation-agnostic fork of system_sensors: capability-detecting host metrics publisher for MQTT/Home Assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Matthew Cunkelman" },
]
keywords = ["mqtt", "home-assistant", "monitoring", "psutil"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "paho-mqtt>=2.0.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
system-sensors-install = "system_sensors.installer:main"
system-sensors-run = "system_sensors.runtime:main"
system-sensors-detect = "system_sensors.detect:main"

[tool.hatch.build.targets.wheel]
packages = ["src/system_sensors"]

[tool.hatch.build.targets.sdist]
include = [
    "src/system_sensors",
    "tests",
    "README.md",
    "requirements.txt",
    "requirements-dev.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
